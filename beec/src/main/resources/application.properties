spring.application.name=beec

# 배포 플랫폼(Render·Railway 등)이 PORT 환경변수로 포트를 지정합니다.
# 로컬에서는 값이 없으므로 8080 을 씁니다. 기존 개발 방식은 그대로입니다.
server.port=${PORT:8080}

# seed.json 15MB 를 파싱하고 35,521건을 메모리에 올립니다.
# 기동에 10초 내외가 걸리므로 헬스체크가 성급하게 실패하지 않도록 여유를 둡니다.
spring.lifecycle.timeout-per-shutdown-phase=20s

# 응답이 크므로(동네 252건, 개선항목 등) 압축을 켭니다. 모바일에서 체감이 큽니다.
server.compression.enabled=true
server.compression.mime-types=application/json,text/html,text/css,application/javascript
server.compression.min-response-size=1024
